<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f7fa" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Connecting Circuit / Puzzle Pathways -->
  <path d="M22 22 L42 22 M22 42 L42 42 M22 22 L22 42 M42 22 L42 42" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 22 L42 42 M42 22 L22 42" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Brain/Sparkle Core -->
  <circle cx="32" cy="32" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" />
  <circle cx="32" cy="32" r="2.5" fill="#10b981" />

  <!-- 4 Interactive Board Nodes (Puzzle Blocks) -->
  <!-- Top Left: Emerald -->
  <g transform="translate(13, 13)">
    <rect width="18" height="18" rx="6" fill="url(#emerald-grad)" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Top Right: Sky Blue -->
  <g transform="translate(33, 13)">
    <rect width="18" height="18" rx="6" fill="url(#blue-grad)" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Bottom Left: Amber -->
  <g transform="translate(13, 33)">
    <rect width="18" height="18" rx="6" fill="url(#amber-grad)" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Bottom Right: Coral -->
  <g transform="translate(33, 33)">
    <rect width="18" height="18" rx="6" fill="url(#coral-grad)" />
    <circle cx="9" cy="9" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
